<h1>Knowledge bases</h1>
<section class="stack">
  @for (kb of knowledgeBases(); track kb.kbId) {
    <mat-card appearance="outlined">
      <mat-card-header>
        <h2 mat-card-title><a [routerLink]="['/kb', kb.kbId]">{{ kb.name }}</a></h2>
        <p mat-card-subtitle>{{ kb.documentCount }} documents · {{ kb.pageCount }} pages</p>
      </mat-card-header>
      @if (kb.description) {
        <mat-card-content>{{ kb.description }}</mat-card-content>
      }
    </mat-card>
  } @empty {
    <p>You have no knowledge bases yet.</p>
  }
</section>
<h2>New knowledge base</h2>
<form class="row" (ngSubmit)="create()">
  <mat-form-field>
    <mat-label>Name</mat-label>
    <input matInput name="name" [(ngModel)]="name" required maxlength="255" />
  </mat-form-field>
  <mat-form-field>
    <mat-label>Description</mat-label>
    <input matInput name="description" [(ngModel)]="description" maxlength="2000" />
  </mat-form-field>
  <button mat-flat-button type="submit" [disabled]="!name().trim()">Create</button>
</form>
