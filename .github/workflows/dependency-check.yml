name: Dependency check

# OWASP dependency check of the Maven dependencies (#63). Not in `mvn verify` and not on every push: it needs the
# network and the NVD data. A finding with CVSS >= 7.0 fails the job.
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # A new key on every run saves the updated NVD data; restore-keys loads the newest earlier copy.
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ github.run_id }}
          restore-keys: nvd-
      - run: mvn -B dependency-check:check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check
          path: target/dependency-check-report.html
          if-no-files-found: ignore
