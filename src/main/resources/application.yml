spring:
  application:
    name: mindforge

  threads:
    virtual:
      enabled: true

  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_SIZE:50MB}
      max-request-size: ${UPLOAD_MAX_SIZE:50MB}

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/mindforge}
    username: ${DATABASE_USERNAME:mindforge}
    password: ${DATABASE_PASSWORD:mindforge}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: openid,profile,email
          github:
            client-id: ${GITHUB_CLIENT_ID:}
            client-secret: ${GITHUB_CLIENT_SECRET:}
            scope: read:user,user:email

  ai:
    openai:
      base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
      api-key: ${OPENROUTER_API_KEY:}
    # Resilience4j owns retries in AIGatewayAdapter; disable Spring AI's built-in retry so
    # attempts aren't multiplied (Resilience4j retries × Spring AI retries). See ADR-0009.
    retry:
      max-attempts: 1

  cache:
    type: caffeine

  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}

server:
  port: ${PORT:8080}
  # Finish in-flight requests; the run worker stops claiming on ContextClosedEvent.
  shutdown: graceful

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

mindforge:
  security:
    jwt-secret: ${JWT_SECRET:}
    jwt-expiry-seconds: ${JWT_EXPIRY_SECONDS:86400}
    secure-cookies: ${AUTH_SECURE_COOKIES:true}
  upload:
    max-size: ${UPLOAD_MAX_SIZE:50MB}
  study:
    quiz-session-ttl: ${QUIZ_SESSION_TTL:PT2H}
  runs:
    # How often the worker settles runs this process is not running and drains queues (ISO-8601).
    sweep-interval: ${RUNS_SWEEP_INTERVAL:PT1M}
  ai:
    background-permits: ${AI_BACKGROUND_PERMITS:4}
    model:
      small: ${AI_MODEL_SMALL:openai/gpt-4o-mini}
      large: ${AI_MODEL_LARGE:openai/gpt-4o}
      vision: ${AI_MODEL_VISION:openai/gpt-4o}
    deadlines:
      interactive: ${AI_DEADLINE_INTERACTIVE:10s}
      batch: ${AI_DEADLINE_BATCH:60s}
      background: ${AI_DEADLINE_BACKGROUND:300s}
    resilience:
      retry:
        max-attempts: ${AI_RETRY_MAX_ATTEMPTS:3}
        initial-interval: ${AI_RETRY_INITIAL_INTERVAL:250ms}
        multiplier: ${AI_RETRY_MULTIPLIER:2.0}
      circuit-breaker:
        failure-rate-threshold: ${AI_CB_FAILURE_RATE:50}
        sliding-window-size: ${AI_CB_WINDOW_SIZE:20}
        minimum-number-of-calls: ${AI_CB_MIN_CALLS:10}
        wait-duration-in-open-state: ${AI_CB_OPEN_WAIT:30s}
        permitted-calls-in-half-open-state: ${AI_CB_HALF_OPEN_CALLS:5}
